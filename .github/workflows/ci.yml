name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Windows runner 控制台默认不是 UTF-8，脚本打印中文会抛 UnicodeEncodeError。
env:
  PYTHONIOENCODING: utf-8

jobs:
  backend:
    name: Backend tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/check_activity_catalog.py
      # 失败时把 pytest 关键行打成注解：Actions 日志要登录才能看，
      # 注解走公开 API 就能读，定位 CI-only 失败不用再本地猜。
      # 只挑失败用例/超时/断言，不把整段线程栈塞进去——GitHub 每个步骤
      # 只保留 10 条注解，堆栈会把真正有用的那行挤掉。
      - name: pytest
        shell: pwsh
        run: |
          pytest -q 2>&1 | Tee-Object -FilePath pytest.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content pytest.log |
              Select-String -Pattern 'short test summary|^(FAILED|ERROR)|Timeout|^E\s{2,}|assert' |
              Select-Object -Last 10 |
              ForEach-Object { "::error::$($_.Line)" }
            exit 1
          }
      - run: ruff check src tests scripts

  # Linux 单独跑一遍后端测试：凭据加密（LinuxAesBox 的 machine-id + uid 派生）、XDG 路径
  # 解析都是平台分支，Windows runner 走不到，只跑 Windows 等于这些能力没有 CI 覆盖。
  backend-linux:
    name: Backend tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/check_activity_catalog.py
      # 与 Windows job 同一套失败注解口径：Actions 日志要登录才能看，注解走公开 API 能读。
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log || {
            grep -E 'short test summary|^(FAILED|ERROR)|Timeout|^E\s{2,}|assert' pytest.log \
              | tail -n 10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - run: ruff check src tests scripts

  web:
    name: Web build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  keel:
    name: Keel gates (four-pillar + preflight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 零依赖脚本，不需要 npm ci：四件套完整性与静态漏洞扫描都只读仓库文件。
      - run: node keel/console-check.mjs --strict
      - run: node keel/preflight-scan.mjs --strict

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 自带的旧 pip 本身可能命中已披露漏洞，先升到最新再审计。
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pip-audit
      - run: pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm ci
        working-directory: desktop
      # electron 等打包依赖都在 devDependencies，最终会被打进安装包，不能 omit=dev。
      - run: npm audit --audit-level=high
        working-directory: desktop

  e2e:
    name: Playwright smoke
    # 凭据加密两个平台都已实现（Windows DPAPI / Linux AES-256-GCM），但这套冒烟跑的是
    # 桌面端主体的 Windows 安装包路径；Linux 桌面壳由 build-desktop 的 ubuntu job 单独构建，
    # runner 没有图形环境，不适合在这里跑 GUI 冒烟。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # 无头模式跑的是独立的 headless shell，必须显式装；只装 chromium 会缺可执行文件。
      - run: npx playwright install chromium chromium-headless-shell
      - run: npm run test:e2e
