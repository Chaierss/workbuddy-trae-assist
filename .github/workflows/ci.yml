name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Windows runner 控制台默认不是 UTF-8，脚本打印中文会抛 UnicodeEncodeError。
env:
  PYTHONIOENCODING: utf-8

jobs:
  backend:
    name: Backend tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/check_activity_catalog.py
      - run: pytest -q
      - run: ruff check src tests scripts

  web:
    name: Web build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - run: pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  e2e:
    name: Playwright smoke
    # 后端凭据加密只有 Windows 实现（DPAPI），非 Windows 会拒绝启动；
    # 冒烟必须跑在目标平台上，不能用不安全开发占位绕过。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # 无头模式跑的是独立的 headless shell，必须显式装；只装 chromium 会缺可执行文件。
      - run: npx playwright install chromium chromium-headless-shell
      - run: npm run test:e2e
