# 守住「内部文档不进公开仓库」这条线。
#
# 为什么单独一个 workflow：`docs/` 同时是应用内 Wiki 的源目录，往里加文档很自然，
# 而里面混着商业规划、内部规格、闭源清单。`.gitignore` 挡得住常规操作，
# 挡不住 `git add -f` 和「顺手改了下 .gitignore」。这个检查跑在每次 push/PR 上，
# 漏了就红，红了就没人会忽略。
#
# 同一个 job 里再跑一遍敏感值扫描：日志、数据库、备份、假密钥被顺手提交时同样要红。
name: repo-guard

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: 内部文档未泄漏
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只用标准库 + git，不需要装依赖
      - name: Check docs whitelist
        run: python scripts/check_public_docs.py

      - name: Check secrets and runtime data
        run: python scripts/check_secrets.py

      # 锁文件的 tarball 地址必须是官方 registry。本机装依赖时若走过国内镜像，
      # `npm ci` 会把镜像地址写进 resolved，境外 runner 拉这些地址直接 504：
      # 表现是「本地装得好好的，只有 CI 的桌面端装依赖必挂」（v1.4.0 / v1.4.1 踩过）。
      - name: Lockfiles point at the official registry
        run: |
          if grep -rnE 'registry\.(npmmirror|npm\.taobao)\.com|mirrors\.(cloud\.tencent|huaweicloud)\.com' \
            --include=package-lock.json .; then
            echo "::error::package-lock.json 里混入了非官方 registry 地址，境外 runner 会 504"
            exit 1
          fi
